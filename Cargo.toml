[package]
name = "computer-use-rs"
version = "0.2.4"
edition = "2024"
rust-version = "1.89"
description = "Cross-platform computer-use primitives: read app accessibility trees, take window screenshots, and drive apps with accessibility actions and synthetic input."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/The-Best-Codes/computer-use-rs"
keywords = [
  "computer-use",
  "accessibility",
  "automation",
  "ui-automation",
  "screenshot",
]
categories = ["accessibility", "os", "gui", "api-bindings"]

[lib]
# Imported as `computer_use`; the package name avoids the unrelated `computer-use` crate.
name = "computer_use"

[package.metadata.docs.rs]
targets = [
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bitflags = "2.13.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
thiserror = "2.0.21"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "libc",
  "NSRunningApplication",
] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXValue", "AXError"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFNumber", "CFString", "CFURL"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "libc", "CGBitmapContext", "CGColorSpace", "CGContext", "CGEvent", "CGEventSource", "CGEventTypes", "CGImage", "CGRemoteOperation", "CGWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSBundle",
  "NSEnumerator",
  "NSError",
  "NSString",
  "NSURL",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCScreenshotManager", "SCShareableContent", "SCStream"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30.0", default-features = false, features = ["proxies"] }
x11rb = { version = "0.14.0", default-features = false }
zbus = { version = "5.19.0", default-features = false, features = [
  "async-io",
  "blocking-api",
] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Conflicts with rustc's `unreachable_pub`, which this crate prefers.
redundant_pub_crate = "allow"
